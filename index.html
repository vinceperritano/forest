<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oliver's Forest</title>
<style>
  :root{
    --green-dark:#1e6b34; --green:#2f9e4f; --green-light:#bfe6c6;
    --cream:#fbf8ef; --ink:#2b3a2b; --gold:#f5c542;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--cream); color:var(--ink); max-width:520px; margin:0 auto;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    background:linear-gradient(180deg,#37a75c,#2f9e4f); color:#fff;
    padding:14px 18px; display:flex; align-items:center; gap:12px;
    border-radius:0 0 22px 22px; box-shadow:0 3px 10px rgba(30,107,52,.25);
  }
  header h1{margin:0; font-size:26px; letter-spacing:.5px;}
  .mascot{width:52px; height:52px; flex:none;}
  .view-toggle{
    display:flex; background:#e4f2e6; border-radius:999px; padding:5px; margin:14px 18px 0;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.08);
  }
  .view-toggle button{
    flex:1; border:0; background:transparent; border-radius:999px; padding:10px;
    font-size:17px; font-weight:700; color:#5d7a5e; cursor:pointer;
  }
  .view-toggle button.active{background:var(--green); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18);}
  #grove{
    position:relative; margin:12px 18px 0; aspect-ratio:1/1; border-radius:20px; overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, #8fd694 0 8%, transparent 9%),
      radial-gradient(circle at 75% 65%, #7cc984 0 6%, transparent 7%),
      linear-gradient(160deg,#a5dd9b 0%,#8fd694 45%,#79c982 100%);
    box-shadow:0 4px 14px rgba(30,107,52,.22), inset 0 0 40px rgba(30,107,52,.12);
    touch-action:manipulation;
  }
  /* decorative grass texture */
  #grove::before{
    content:""; position:absolute; inset:0; opacity:.35; pointer-events:none;
    background-image:radial-gradient(#6dbb76 1.5px, transparent 1.6px);
    background-size:26px 26px; background-position:0 0, 13px 13px;
  }
  .tree{
    position:absolute; transform:translate(-50%,-85%); cursor:pointer;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
    transition:transform .15s ease;
  }
  .tree:active{transform:translate(-50%,-85%) scale(1.12);}
  .tree svg{display:block;}
  .tree.pop-in{animation:pop .45s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{0%{transform:translate(-50%,-85%) scale(0);}70%{transform:translate(-50%,-85%) scale(1.15);}100%{transform:translate(-50%,-85%) scale(1);}}
  .empty-hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; color:#2f6b3f; font-size:17px; padding:30px; pointer-events:none;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .stats{
    margin:12px 18px 0; background:#fff; border-radius:16px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:15px;
  }
  .stats .stat{text-align:center; flex:1;}
  .stats .stat b{display:block; font-size:19px; color:var(--green-dark);}
  .stats .divider{width:1px; align-self:stretch; background:#e3e3d2;}
  .fact{
    margin:10px 18px 0; background:#fdf3d8; border:2px solid #f0d488; border-radius:14px;
    padding:10px 14px; font-size:14.5px; display:flex; gap:10px; align-items:flex-start;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .fact .spark{font-size:20px; flex:none;}
  #plantBtn{
    margin:14px 18px 20px; border:0; border-radius:18px; padding:18px;
    background:linear-gradient(180deg,#37a75c,#2c8a44); color:#fff;
    font-size:22px; font-weight:800; letter-spacing:.5px; cursor:pointer;
    box-shadow:0 5px 0 #1e6b34, 0 8px 14px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  #plantBtn:active{transform:translateY(4px); box-shadow:0 1px 0 #1e6b34;}
  /* modal */
  .modal-back{
    position:fixed; inset:0; background:rgba(30,50,30,.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-back.open{display:flex;}
  .modal{
    background:var(--cream); border-radius:20px; padding:22px; width:100%; max-width:380px;
    box-shadow:0 12px 40px rgba(0,0,0,.3); animation:pop .25s ease;
  }
  .modal h2{margin:0 0 4px; font-size:22px; color:var(--green-dark); display:flex; align-items:center; gap:8px;}
  .modal .note{font-size:16px; margin:8px 0; background:#fff; border-radius:10px; padding:10px 12px; border:1px solid #e7e2cf;}
  .modal .meta{font-size:13px; color:#777;}
  .modal label{display:block; font-size:14px; font-weight:700; margin:12px 0 4px; color:var(--green-dark);}
  .modal input{
    width:100%; font-size:17px; padding:12px; border-radius:12px; border:2px solid #d8e6d3;
    font-family:inherit;
  }
  .modal input:focus{outline:none; border-color:var(--green);}
  .modal .row{display:flex; gap:10px; margin-top:18px;}
  .modal .row button{
    flex:1; border:0; border-radius:12px; padding:13px; font-size:17px; font-weight:700; cursor:pointer;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-secondary{background:#e8e4d5; color:#5a5a4a;}
  .btn-danger{background:none; border:0; color:#b04a3a; font-size:14px; margin-top:14px; cursor:pointer; padding:6px;}
  .footer-note{text-align:center; font-size:12px; color:#999; padding:0 18px 22px;}
</style>
</head>
<body>

<header>
  <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
    <ellipse cx="32" cy="58" rx="14" ry="4" fill="rgba(0,0,0,.15)"/>
    <rect x="28" y="38" width="8" height="18" rx="3" fill="#8a5a33"/>
    <circle cx="32" cy="26" r="20" fill="#3f9e58"/>
    <circle cx="22" cy="20" r="9" fill="#52b86a"/>
    <circle cx="42" cy="20" r="9" fill="#52b86a"/>
    <circle cx="26" cy="24" r="2.6" fill="#222"/><circle cx="38" cy="24" r="2.6" fill="#222"/>
    <circle cx="27" cy="23" r=".9" fill="#fff"/><circle cx="39" cy="23" r=".9" fill="#fff"/>
    <path d="M27 31 Q32 35 37 31" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="29" r="2.4" fill="#ff9d9d" opacity=".8"/><circle cx="42" cy="29" r="2.4" fill="#ff9d9d" opacity=".8"/>
  </svg>
  <h1>Oliver's Forest</h1>
</header>

<div class="view-toggle" role="tablist">
  <button id="tabMonth" class="active">October</button>
  <button id="tabAll">All-Time</button>
</div>

<div id="grove" aria-label="The forest"></div>

<div class="stats">
  <div class="stat"><b id="statMonth">0</b><span id="statMonthLabel">in October</span></div>
  <div class="divider"></div>
  <div class="stat"><b id="statAll">0</b>all time</div>
  <div class="divider"></div>
  <div class="stat"><b id="statLand">—</b><span id="statLandLabel">of forest</span></div>
</div>

<div class="fact"><span class="spark">✨</span><span><b>Forest fact!</b> <span id="factText"></span></span></div>

<button id="plantBtn">🌱 Plant a Tree</button>
<div class="footer-note">Every tree planted here is a real tree, planted with love.</div>

<!-- view / remove tree -->
<div class="modal-back" id="viewBack">
  <div class="modal">
    <h2 id="viewName">Tree</h2>
    <div class="note" id="viewNote"></div>
    <div class="meta" id="viewMeta"></div>
    <button class="btn-danger" id="removeTree">Remove this tree</button>
    <div class="row"><button class="btn-primary" id="closeView" style="flex:1">Close</button></div>
  </div>
</div>

<!-- plant a tree -->
<div class="modal-back" id="plantBack">
  <div class="modal">
    <h2>🌱 Plant a Tree</h2>
    <label for="treeName">Give it a name <span style="font-weight:400;color:#888">(optional)</span></label>
    <input id="treeName" maxlength="40" placeholder="e.g. Captain Bark" autocomplete="off">
    <label for="treeNote">What is this tree for?</label>
    <input id="treeNote" maxlength="120" placeholder="e.g. Reading a whole book" autocomplete="off">
    <div class="row">
      <button class="btn-secondary" id="cancelPlant">Cancel</button>
      <button class="btn-primary" id="confirmPlant">Plant it!</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "olivers-forest-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {trees:[]}; }catch(e){ return {trees:[]}; } }
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
let state = load();

/* ---------- helpers ---------- */
function monthName(d){ return d.toLocaleString("en-US",{month:"long"}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// deterministic PRNG from string
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const FACTS = [
  "Trees talk to each other underground through tiny fungi networks — like a forest internet!",
  "A big tree can make enough oxygen for two people to breathe for a whole year.",
  "One tree can soak up about 22 kg of CO\u2082 from the air every year.",
  "The oldest known tree is more than 5,000 years old — it was already ancient when the pyramids were built!",
  "A single tree can be home to hundreds of insects, birds, and small animals.",
  "Trees drink rain through their roots and breathe out fresh water vapor that helps make clouds.",
  "Some trees can warn their neighbors about hungry insects by sending chemical messages through the air."
];
function factForToday(){
  const now = new Date();
  const day = Math.floor(now.getTime()/86400000);
  return FACTS[day % FACTS.length];
}

/* ---------- tree art (4 varieties, original) ---------- */
function treeSVG(v){
  const faces = '<circle cx="38" cy="46" r="2.4" fill="#26332a"/><circle cx="52" cy="46" r="2.4" fill="#26332a"/><path d="M40 54 Q45 58 50 54" stroke="#26332a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  if(v===0) return `<svg width="76" height="92" viewBox="0 0 90 108"><ellipse cx="45" cy="102" rx="20" ry="5" fill="rgba(0,0,0,.18)"/><rect x="40" y="66" width="10" height="32" rx="4" fill="#8a5a33"/><circle cx="45" cy="44" r="30" fill="#3f9e58"/><circle cx="30" cy="34" r="13" fill="#55b96e"/><circle cx="60" cy="34" r="13" fill="#55b96e"/>${faces}</svg>`;
  if(v===1) return `<svg width="66" height="96" viewBox="0 0 80 112"><ellipse cx="40" cy="106" rx="18" ry="5" fill="rgba(0,0,0,.18)"/><rect x="36" y="88" width="8" height="16" rx="3" fill="#8a5a33"/><polygon points="40,6 14,52 66,52" fill="#2f8f4e"/><polygon points="40,30 10,74 70,74" fill="#379e57"/><polygon points="40,54 8,96 72,96" fill="#3faa60"/><circle cx="33" cy="60" r="2.4" fill="#26332a"/><circle cx="47" cy="60" r="2.4" fill="#26332a"/><path d="M35 68 Q40 72 45 68" stroke="#26332a" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
  if(v===2) return `<svg width="52" height="80" viewBox="0 0 60 92"><ellipse cx="30" cy="87" rx="13" ry="4" fill="rgba(0,0,0,.15)"/><rect x="27" y="52" width="6" height="32" rx="3" fill="#7c4f2c"/><ellipse cx="30" cy="34" rx="10" ry="20" fill="#4aa862" transform="rotate(-18 30 34)"/><ellipse cx="30" cy="34" rx="10" ry="20" fill="#55b96e" transform="rotate(18 30 34)"/><ellipse cx="30" cy="26" rx="8" ry="14" fill="#63c477"/></svg>`;
  return `<svg width="70" height="84" viewBox="0 0 84 100"><ellipse cx="42" cy="94" rx="19" ry="5" fill="rgba(0,0,0,.18)"/><rect x="38" y="62" width="8" height="28" rx="4" fill="#8a5a33"/><ellipse cx="42" cy="40" rx="30" ry="26" fill="#46a862"/><ellipse cx="26" cy="32" rx="12" ry="10" fill="#5cbf76"/><ellipse cx="58" cy="32" rx="12" ry="10" fill="#5cbf76"/>${faces}</svg>`;
}

/* ---------- grove rendering ---------- */
const grove = document.getElementById("grove");
let view = "month"; // or "all"
let viewingId = null;

function treesForView(){
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const list = state.trees.slice().sort((a,b)=>a.ts-b.ts);
  if(view==="month") return list.filter(t=>{ const d=new Date(t.ts); return d.getMonth()===m && d.getFullYear()===y; });
  return list;
}

function render(popId){
  const trees = treesForView();
  grove.innerHTML = "";
  if(trees.length===0){
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = view==="month"
      ? "No trees planted yet this month — tap \u201cPlant a Tree\u201d to grow the first one! 🌱"
      : "The all-time forest is empty — every forest starts with one tree. 🌱";
    grove.appendChild(hint);
  }
  // deterministic placement: shuffled cells + jitter
  const rnd = mulberry32(hashStr("grove"+view));
  const cells = [];
  const N = 7;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) cells.push([i,j]);
  for(let i=cells.length-1;i>0;i--){ const k=Math.floor(rnd()*(i+1)); const t=cells[i]; cells[i]=cells[k]; cells[k]=t; }
  trees.forEach((t,idx)=>{
    const [ci,cj] = cells[idx % cells.length];
    const jitter = ()=> (mulberry32(hashStr(t.id))()-0.5)*10;
    const x = 8 + (ci+0.5)/N*84 + jitter()*0.4;
    const y = 12 + (cj+0.5)/N*76 + jitter()*0.4;
    const el = document.createElement("div");
    el.className = "tree" + (t.id===popId ? " pop-in" : "");
    el.style.left = x+"%"; el.style.top = y+"%";
    const scale = 0.72 + mulberry32(hashStr(t.id+"s"))()*0.5;
    el.style.width = Math.round(76*scale)+"px";
    el.innerHTML = treeSVG(t.variety % 4);
    el.addEventListener("click", ()=> openView(t.id));
    grove.appendChild(el);
  });
  updateStats();
}

function updateStats(){
  const now = new Date();
  const m = now.getMonth(), y = now.getFullYear();
  const monthCount = state.trees.filter(t=>{ const d=new Date(t.ts); return d.getMonth()===m && d.getFullYear()===y; }).length;
  const allCount = state.trees.length;
  document.getElementById("statMonth").textContent = monthCount;
  document.getElementById("statMonthLabel").textContent = "in " + monthName(now);
  document.getElementById("statAll").textContent = allCount;
  document.getElementById("tabMonth").textContent = monthName(now);
  // land: ~100 sq ft per young tree, basketball court = 4,700 sq ft
  const sqft = allCount*100, court = 4700;
  let land;
  if(allCount===0) land = "—";
  else if(sqft < court*0.75) land = "≈" + sqft.toLocaleString() + " sq ft";
  else {
    const c = Math.round(sqft/court*2)/2;
    land = "≈" + (c===1?"1 basketball court": c+" courts");
  }
  document.getElementById("statLand").textContent = land;
  document.getElementById("statLandLabel").textContent = "of forest";
  document.getElementById("factText").textContent = factForToday();
}

/* ---------- view / plant modals ---------- */
const viewBack = document.getElementById("viewBack");
function openView(id){
  const t = state.trees.find(x=>x.id===id); if(!t) return;
  viewingId = id;
  document.getElementById("viewName").textContent = t.name || "A tree";
  document.getElementById("viewNote").textContent = t.note ? "\u201c"+t.note+"\u201d" : "Planted with love.";
  const d = new Date(t.ts);
  document.getElementById("viewMeta").textContent = "Planted " + d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  viewBack.classList.add("open");
}
document.getElementById("closeView").addEventListener("click", ()=> viewBack.classList.remove("open"));
viewBack.addEventListener("click", e=>{ if(e.target===viewBack) viewBack.classList.remove("open"); });
document.getElementById("removeTree").addEventListener("click", ()=>{
  if(!viewingId) return;
  if(confirm("Remove this tree from the forest?")){
    state.trees = state.trees.filter(t=>t.id!==viewingId);
    save(state); viewingId=null; viewBack.classList.remove("open"); render();
  }
});

const plantBack = document.getElementById("plantBack");
document.getElementById("plantBtn").addEventListener("click", ()=>{
  document.getElementById("treeName").value = "";
  document.getElementById("treeNote").value = "";
  plantBack.classList.add("open");
  setTimeout(()=>document.getElementById("treeName").focus(), 150);
});
document.getElementById("cancelPlant").addEventListener("click", ()=> plantBack.classList.remove("open"));
plantBack.addEventListener("click", e=>{ if(e.target===plantBack) plantBack.classList.remove("open"); });
document.getElementById("confirmPlant").addEventListener("click", ()=>{
  const name = document.getElementById("treeName").value.trim();
  const note = document.getElementById("treeNote").value.trim();
  const id = "t" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
  state.trees.push({ id, name, note, ts: Date.now(), variety: Math.floor(Math.random()*4) });
  save(state); plantBack.classList.remove("open"); render(id);
});

/* ---------- tabs ---------- */
const tabMonth = document.getElementById("tabMonth"), tabAll = document.getElementById("tabAll");
tabMonth.addEventListener("click", ()=>{ view="month"; tabMonth.classList.add("active"); tabAll.classList.remove("active"); render(); });
tabAll.addEventListener("click", ()=>{ view="all"; tabAll.classList.add("active"); tabMonth.classList.remove("active"); render(); });

render();
</script>
</body>
</html>
